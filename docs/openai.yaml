openapi: 3.0.3
info:
  title: Testlio API
  description: API for managing issues and revisions with Domain-Driven Design
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
components:
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
    X-Client-ID:
      type: apiKey
      in: header
      name: X-Client-ID
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
      required:
        - email
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - access_token
    CreateIssueDto:
      type: object
      properties:
        title:
          type: string
          example: Test Issue
        description:
          type: string
          example: This is a test issue
      required:
        - title
        - description
    UpdateIssueDto:
      type: object
      properties:
        title:
          type: string
          example: Updated Issue
        description:
          type: string
          example: Updated description
    Issue:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Test Issue
        description:
          type: string
          example: This is a test issue
        created_by:
          type: string
          example: user@example.com
        updated_by:
          type: string
          example: user@example.com
        updatedAt:
          type: string
          format: date-time
          example: 2025-05-03T07:03:30.565Z
      required:
        - id
        - title
        - description
        - created_by
        - updated_by
        - updatedAt
    Revision:
      type: object
      properties:
        id:
          type: integer
          example: 1
        issueId:
          type: integer
          example: 1
        issue:
          type: object
          properties:
            title:
              type: string
              example: Test Issue
            description:
              type: string
              example: This is a test issue
          required:
            - title
            - description
        changes:
          type: object
          additionalProperties:
            type: string
          example:
            title: Test Issue
            description: This is a test issue
        created_by:
          type: string
          example: user@example.com
        updatedAt:
          type: string
          format: date-time
          example: 2025-05-03T07:03:30.565Z
      required:
        - id
        - issueId
        - issue
        - changes
        - created_by
        - updatedAt
    PaginatedIssues:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        total:
          type: integer
          example: 10
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
      required:
        - data
        - total
        - page
        - limit
    CompareRevisionsDto:
      type: object
      properties:
        revisionA:
          type: integer
          example: 1
        revisionB:
          type: integer
          example: 3
      required:
        - revisionA
        - revisionB
    CompareRevisionsResponse:
      type: object
      properties:
        before:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
          example:
            title: Test
            description: test test
        after:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
          example:
            title: Test
            description: hola hola
        changes:
          type: object
          additionalProperties:
            type: object
            properties:
              before:
                type: string
              after:
                type: string
          example:
            description:
              before: test test
              after: hola hola
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/Revision'
      required:
        - before
        - after
        - changes
        - revisions
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 404
        message:
          type: string
          example: Not Found
        error:
          type: string
          example: Not Found
      required:
        - statusCode
        - message
        - error
paths:
  /auth/login:
    post:
      summary: Generate a JWT token
      operationId: login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: JWT token generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /issues:
    post:
      summary: Create a new issue
      operationId: createIssue
      tags:
        - Issues
      security:
        - JWT: []
        - X-Client-ID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueDto'
      responses:
        '201':
          description: Issue created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Get a paginated list of issues
      operationId: getIssues
      tags:
        - Issues
      security:
        - JWT: []
        - X-Client-ID: []
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            example: 10
      responses:
        '200':
          description: List of issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIssues'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /issues/{id}:
    patch:
      summary: Update an issue
      operationId: updateIssue
      tags:
        - Issues
      security:
        - JWT: []
        - X-Client-ID: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueDto'
      responses:
        '200':
          description: Issue updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Issue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /issues/{id}/revisions:
    get:
      summary: Get revisions for an issue
      operationId: getIssueRevisions
      tags:
        - Issues
      security:
        - JWT: []
        - X-Client-ID: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: List of revisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Revision'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /issues/{id}/compare:
    get:
      summary: Compare two revisions of an issue
      operationId: compareRevisions
      tags:
        - Issues
      security:
        - JWT: []
        - X-Client-ID: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: revisionA
          in: query
          required: true
          schema:
            type: integer
            example: 1
        - name: revisionB
          in: query
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Comparison of revisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompareRevisionsResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Revisions not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'